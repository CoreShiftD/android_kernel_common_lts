name: Pack Drive Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "rom-port-images"

      extra_tag:
        description: "Optional suffix, for example inoi-advan-test1"
        required: false
        default: ""

      system_url:
        description: "Google Drive/direct link for system image"
        required: false
        default: ""

      product_url:
        description: "Google Drive/direct link for product image"
        required: false
        default: ""

      system_ext_url:
        description: "Google Drive/direct link for system_ext image"
        required: false
        default: ""

      vendor_url:
        description: "Google Drive/direct link for vendor image"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            tar \
            xz-utils \
            coreutils \
            python3 \
            python3-pip

          python3 -m pip install --user -U gdown || \
          python3 -m pip install --user --break-system-packages -U gdown

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download images
        env:
          SYSTEM_URL: ${{ inputs.system_url }}
          PRODUCT_URL: ${{ inputs.product_url }}
          SYSTEM_EXT_URL: ${{ inputs.system_ext_url }}
          VENDOR_URL: ${{ inputs.vendor_url }}
        run: |
          set -euo pipefail

          mkdir -p images out

          drive_id_from_url() {
            local url="$1"
            local id=""

            id="$(echo "$url" | sed -nE 's#.*\/d\/([^/]+).*#\1#p')"

            if [ -z "$id" ]; then
              id="$(echo "$url" | sed -nE 's#.*[?&]id=([^&]+).*#\1#p')"
            fi

            echo "$id"
          }

          browser_curl_drive() {
            local file_id="$1"
            local out="$2"
            local cookie="/tmp/gdrive.cookie"
            local html="/tmp/gdrive.html"

            rm -f "$cookie" "$html"

            curl -L \
              -A "Mozilla/5.0" \
              -c "$cookie" \
              "https://drive.google.com/uc?export=download&id=${file_id}" \
              -o "$html"

            confirm="$(
              grep -oE 'confirm=[0-9A-Za-z_-]+' "$html" \
                | head -n1 \
                | cut -d= -f2 || true
            )"

            if [ -n "$confirm" ]; then
              curl -L \
                -A "Mozilla/5.0" \
                -b "$cookie" \
                "https://drive.google.com/uc?export=download&confirm=${confirm}&id=${file_id}" \
                -o "$out"
            else
              mv "$html" "$out"
            fi
          }

          validate_download() {
            local out="$1"

            if [ ! -f "$out" ]; then
              echo "ERROR: $out was not created"
              exit 1
            fi

            size="$(wc -c < "$out" | tr -d ' ')"

            if [ "$size" = "0" ]; then
              echo "ERROR: $out is 0 bytes"
              exit 1
            fi

            if head -c 1024 "$out" | grep -qiE '<html|<!doctype html|Google Drive|quota exceeded|virus scan|Sign in'; then
              echo "ERROR: $out looks like an HTML/Google Drive error page, not an image"
              echo "Make sure the Google Drive file is public/shareable."
              exit 1
            fi

            echo "OK: $out size=$size bytes"
          }

          download_file() {
            local name="$1"
            local url="$2"
            local out="images/${name}.img"

            if [ -z "$url" ]; then
              echo "Skipping $name: no URL provided"
              return 0
            fi

            echo
            echo "Downloading $name -> $out"

            if echo "$url" | grep -q "drive.google.com"; then
              file_id="$(drive_id_from_url "$url")"

              if [ -z "$file_id" ]; then
                echo "ERROR: Could not parse Google Drive file ID from:"
                echo "$url"
                exit 1
              fi

              echo "Google Drive file ID: $file_id"

              if gdown --continue "$file_id" -O "$out"; then
                echo "gdown download finished"
              else
                echo "gdown failed, trying browser-like curl fallback..."
                browser_curl_drive "$file_id" "$out"
              fi
            else
              curl -L \
                --fail \
                --retry 5 \
                --retry-delay 5 \
                -A "Mozilla/5.0" \
                "$url" \
                -o "$out"
            fi

            validate_download "$out"
          }

          download_file "system" "$SYSTEM_URL"
          download_file "product" "$PRODUCT_URL"
          download_file "system_ext" "$SYSTEM_EXT_URL"
          download_file "vendor" "$VENDOR_URL"

      - name: Show downloaded images
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          ls -lh images || true

          if ! ls images/*.img >/dev/null 2>&1; then
            echo "ERROR: no images were downloaded"
            exit 1
          fi

          sha256sum images/*.img > out/SHA256SUMS.txt

          echo
          echo "SHA256:"
          cat out/SHA256SUMS.txt

      - name: Pack tar.xz
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"

          if [ -n "$EXTRA_TAG" ]; then
            TAG="${TAG}-${EXTRA_TAG}"
          fi

          mkdir -p out/release-assets

          cp out/SHA256SUMS.txt out/release-assets/SHA256SUMS.original-images.txt

          check_size_under_release_limit() {
            local file="$1"
            local limit=$((1900 * 1024 * 1024))
            local size

            size="$(wc -c < "$file" | tr -d ' ')"

            echo "Size: $file = $size bytes"

            if [ "$size" -gt "$limit" ]; then
              echo "ERROR: $file is larger than 1900 MiB."
              echo "GitHub release assets have a practical 2 GiB limit."
              echo "Use smaller groups or split this archive."
              exit 1
            fi
          }

          pack_archive() {
            local name="$1"
            shift

            local files=()

            for f in "$@"; do
              if [ -f "images/$f" ]; then
                files+=("$f")
              else
                echo "Skipping missing $f"
              fi
            done

            if [ "${#files[@]}" -eq 0 ]; then
              echo "No files for $name, skipping archive"
              return 0
            fi

            local archive="out/release-assets/${TAG}-${name}.tar.xz"

            echo
            echo "Creating archive: $archive"
            echo "Included:"
            printf '  - %s\n' "${files[@]}"

            tar -C images -I 'xz -9e -T0' -cf "$archive" "${files[@]}"

            check_size_under_release_limit "$archive"
            sha256sum "$archive" > "${archive}.sha256"
          }

          IMAGE_COUNT="$(find images -maxdepth 1 -type f -name '*.img' | wc -l | tr -d ' ')"

          echo "Image count: $IMAGE_COUNT"

          if [ "$IMAGE_COUNT" -gt 2 ]; then
            echo "More than 2 partitions detected."
            echo "Packing as grouped archives:"
            echo "  system + system_ext"
            echo "  product + vendor"

            pack_archive "system_system_ext" \
              system.img \
              system_ext.img

            pack_archive "product_vendor" \
              product.img \
              vendor.img
          else
            echo "2 or fewer partitions detected."
            echo "Packing as single archive."

            pack_archive "images" \
              system.img \
              product.img \
              system_ext.img \
              vendor.img
          fi

          cat > out/release-assets/MANIFEST.txt <<EOF
          Release: $TAG

          Packing rule:
          - If 2 or fewer partition images are provided:
            ${TAG}-images.tar.xz

          - If more than 2 partition images are provided:
            ${TAG}-system_system_ext.tar.xz
              contains system.img and system_ext.img if provided

            ${TAG}-product_vendor.tar.xz
              contains product.img and vendor.img if provided

          Verify archives:
            sha256sum -c '*.tar.xz.sha256'

          Extract:
            tar -xf <archive>.tar.xz

          Verify extracted images:
            sha256sum -c SHA256SUMS.original-images.txt
          EOF

          echo "TAG=$TAG" >> "$GITHUB_ENV"

          echo
          echo "Release assets:"
          ls -lh out/release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: out/release-assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Publishing release: $TAG"
          echo "Repo: $GH_REPO"

          ASSETS=(out/release-assets/*)

          cat > out/release-notes.md <<EOF
          Packed ROM images from workflow inputs.

          Packing rule:

          - If 2 or fewer partition images were provided, assets are packed into one archive:
            - ${TAG}-images.tar.xz

          - If more than 2 partition images were provided, assets are split into grouped archives:
            - ${TAG}-system_system_ext.tar.xz
            - ${TAG}-product_vendor.tar.xz

          Extract:

          \`\`\`bash
          tar -xf '<archive>.tar.xz'
          sha256sum -c SHA256SUMS.original-images.txt
          \`\`\`
          EOF

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release exists, uploading assets..."
            gh release upload "$TAG" \
              "${ASSETS[@]}" \
              --repo "$GH_REPO" \
              --clobber
          else
            echo "Creating release..."
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --repo "$GH_REPO" \
              --title "$TAG" \
              --notes-file out/release-notes.md
          fi
