name: Pack Drive Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "rom-port-images"
      system_url:
        description: "Google Drive/direct link for system.img"
        required: false
      product_url:
        description: "Google Drive/direct link for product.img"
        required: false
      system_ext_url:
        description: "Google Drive/direct link for system_ext.img"
        required: false
      vendor_url:
        description: "Google Drive/direct link for vendor.img"
        required: false
      extra_tag:
        description: "Optional suffix"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils tar coreutils python3-pip
          python3 -m pip install --user --break-system-packages gdown
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download images
        env:
          SYSTEM_URL: ${{ inputs.system_url }}
          PRODUCT_URL: ${{ inputs.product_url }}
          SYSTEM_EXT_URL: ${{ inputs.system_ext_url }}
          VENDOR_URL: ${{ inputs.vendor_url }}
        run: |
          set -euo pipefail

          mkdir -p images out

          download_file() {
            local name="$1"
            local url="$2"
            local out="images/${name}.img"

            if [ -z "$url" ]; then
              echo "Skipping $name: no URL provided"
              return 0
            fi

            echo "Downloading $name -> $out"

            if echo "$url" | grep -q "drive.google.com"; then
              gdown --fuzzy --continue "$url" -O "$out"
            else
              curl -L --fail --retry 5 --retry-delay 5 "$url" -o "$out"
            fi

            if [ ! -f "$out" ]; then
              echo "ERROR: $out was not created"
              exit 1
            fi

            size="$(wc -c < "$out" | tr -d ' ')"

            if [ "$size" = "0" ]; then
              echo "ERROR: $out is 0 bytes"
              exit 1
            fi

            if head -c 512 "$out" | grep -qiE '<html|<!doctype html|Google Drive|quota exceeded|virus scan'; then
              echo "ERROR: $out looks like an HTML/Google Drive error page, not an image"
              echo "Make sure the Drive file is public or use a direct downloadable link."
              exit 1
            fi

            echo "OK: $out size=$size"
          }

          download_file "system" "$SYSTEM_URL"
          download_file "product" "$PRODUCT_URL"
          download_file "system_ext" "$SYSTEM_EXT_URL"
          download_file "vendor" "$VENDOR_URL"

      - name: List and hash images
        run: |
          set -euo pipefail
          ls -lh images
          sha256sum images/* > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Pack tar.xz
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          if [ -n "$EXTRA_TAG" ]; then
            TAG="${TAG}-${EXTRA_TAG}"
          fi

          ARCHIVE="out/${TAG}.tar.xz"

          echo "Creating $ARCHIVE with xz -9e..."
          tar -I 'xz -9e -T0' -cf "$ARCHIVE" images

          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            out/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release exists. Uploading assets..."
            gh release upload "$TAG" \
              "$ARCHIVE" \
              "${ARCHIVE}.sha256" \
              out/SHA256SUMS.txt \
              --repo "$GH_REPO" \
              --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              "$ARCHIVE" \
              "${ARCHIVE}.sha256" \
              out/SHA256SUMS.txt \
              --repo "$GH_REPO" \
              --title "$TAG" \
              --notes "Packed ROM images from workflow inputs."
          fi
