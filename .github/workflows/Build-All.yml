name: Build all ACK/GKI profiles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile:
          - android11-5.4-lts
          - android12-5.4-lts
          - android12-5.10-lts
          - android13-5.10-lts
          - android13-5.15-lts
          - android14-5.15-lts
          - android14-6.1-lts
          - android15-6.6-lts
          - android16-6.12-lts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install repo tool
        shell: bash
        run: ./scripts/install-repo-tool.sh

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          # This workflow intentionally exposes no options.
          # It is for batch-testing all supported profiles.
          # Per-profile customization belongs in Build.yml or local scripts/build-kernel.sh usage.
          # max-parallel is kept low because kernel builds are heavy.
          ./scripts/build-kernel.sh "${{ matrix.profile }}" \
            --disable-defconfig-check on

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.profile }}-${{ github.run_number }}
          path: dist/${{ matrix.profile }}/
          if-no-files-found: error
