name: Fetch and release AOSP Clang

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-aosp-clang
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve configured Clang versions
    runs-on: ubuntu-24.04

    outputs:
      clang_matrix: ${{ steps.resolve.outputs.clang_matrix }}

    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl git jq

      - name: Resolve configured + latest AOSP Clang
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          MIRROR_BRANCH="mirror-goog-main-llvm-toolchain-source"
          TOOLCHAINS_JSON="$GITHUB_WORKSPACE/configs/toolchains.json"

          test -f "$TOOLCHAINS_JSON" || {
            echo "Missing $TOOLCHAINS_JSON" >&2
            exit 1
          }

          rm -rf /tmp/aosp-clang-readme

          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-checkout \
            --branch "$MIRROR_BRANCH" \
            "$REPO_URL" \
            /tmp/aosp-clang-readme

          cd /tmp/aosp-clang-readme

          git sparse-checkout init --cone
          git sparse-checkout set README.md
          git checkout

          LATEST_CLANG="$(
            awk '
              /Android Platform/ { in_platform=1; next }
              in_platform && /Currently clang-r/ {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^clang-r[0-9A-Za-z._-]+$/) {
                    print $i
                    exit
                  }
                }
              }
            ' README.md
          )"

          if [ -z "$LATEST_CLANG" ]; then
            echo "Could not resolve Android Platform clang from README.md" >&2
            exit 1
          fi

          echo "Resolved latest Android Platform Clang: $LATEST_CLANG"

          {
            jq -r '
              [
                .default?,
                .fallback?,
                ((.by_branch // {})[]?),
                ((.versions // [])[]?)
              ]
              | .[]
              | select(type == "string" and startswith("clang-r"))
            ' "$TOOLCHAINS_JSON"

            printf '%s\n' "$LATEST_CLANG"
          } | sort -u > /tmp/clang-versions.txt

          echo "Configured Clang versions:"
          cat /tmp/clang-versions.txt

          # Newest-first fallback order.
          # First branch/ref containing the requested clang-r* wins.
          CANDIDATE_REFS=(
            "refs/heads/mirror-goog-main-llvm-toolchain-source"
            "refs/heads/android16-release"
            "refs/heads/android15-release"
            "refs/heads/android14-release"
            "refs/heads/android13-release"
            "refs/heads/android12L-release"
            "refs/heads/android12-release"
            "refs/heads/main"
            "refs/heads/master"
          )

          ref_has_clang() {
            local ref="$1"
            local clang="$2"
            local url="${REPO_URL}/+/${ref}/${clang}?format=JSON"

            curl -fsSL "$url" >/dev/null 2>&1
          }

          find_ref_for_clang() {
            local clang="$1"
            local ref

            for ref in "${CANDIDATE_REFS[@]}"; do
              echo "Probing $clang on $ref..." >&2

              if ref_has_clang "$ref" "$clang"; then
                printf '%s\n' "$ref"
                return 0
              fi
            done

            return 1
          }

          : > /tmp/clang-matrix.tsv

          while IFS= read -r clang; do
            case "$clang" in
              clang-r*) ;;
              *)
                echo "Invalid clang version: $clang" >&2
                exit 1
                ;;
            esac

            ref="$(find_ref_for_clang "$clang" || true)"

            if [ -z "${ref:-}" ]; then
              echo "Could not find $clang in candidate AOSP refs." >&2
              echo "Add the correct source ref to CANDIDATE_REFS." >&2
              exit 1
            fi

            echo "Resolved $clang -> $ref"
            printf '%s\t%s\n' "$clang" "$ref" >> /tmp/clang-matrix.tsv
          done < /tmp/clang-versions.txt

          jq -R -s -c '
            split("\n")
            | map(select(length > 0))
            | map(split("\t"))
            | map({
                clang: .[0],
                aosp_ref: .[1]
              })
          ' /tmp/clang-matrix.tsv > /tmp/clang-matrix.json

          echo "Resolved matrix:"
          cat /tmp/clang-matrix.json
          echo

          echo "clang_matrix=$(cat /tmp/clang-matrix.json)" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.clang }}
    runs-on: ubuntu-24.04
    needs: resolve

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.clang_matrix) }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git tar zstd

      - name: Sparse-fetch ${{ matrix.clang }}
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          CLANG_VERSION="${{ matrix.clang }}"
          AOSP_REF="${{ matrix.aosp_ref }}"

          rm -rf /tmp/aosp-clang

          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-checkout \
            "$REPO_URL" \
            /tmp/aosp-clang

          cd /tmp/aosp-clang

          git sparse-checkout init --cone
          git sparse-checkout set "$CLANG_VERSION"

          git fetch --depth=1 origin "$AOSP_REF"
          git checkout --detach FETCH_HEAD

          test -x "$CLANG_VERSION/bin/clang" || {
            echo "Missing $CLANG_VERSION/bin/clang" >&2
            exit 1
          }

          COMMIT="$(git rev-parse HEAD)"
          SHORT_COMMIT="$(git rev-parse --short HEAD)"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          "$CLANG_VERSION/bin/clang" --version | tee "$GITHUB_WORKSPACE/dist/clang-version.txt"

          cat > "$GITHUB_WORKSPACE/dist/build-info.txt" <<EOF
          clang_version=${CLANG_VERSION}
          aosp_ref=${AOSP_REF}
          aosp_project=platform/prebuilts/clang/host/linux-x86
          aosp_commit=${COMMIT}
          source=configs/toolchains.json + latest Android Platform Clang
          EOF

          tar --zstd -cf "$GITHUB_WORKSPACE/dist/${CLANG_VERSION}-linux-x86-${SHORT_COMMIT}.tar.zst" \
            "$CLANG_VERSION"

          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./* > SHA256SUMS

      - name: Upload packaged Clang
        uses: actions/upload-artifact@v4
        with:
          name: clang-${{ matrix.clang }}
          path: dist/*
          retention-days: 1

  release:
    name: Release ${{ matrix.clang }}
    runs-on: ubuntu-24.04
    needs:
      - resolve
      - package

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.clang_matrix) }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download packaged Clang
        uses: actions/download-artifact@v4
        with:
          name: clang-${{ matrix.clang }}
          path: dist/${{ matrix.clang }}

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          CLANG_VERSION="${{ matrix.clang }}"
          OUT_DIR="$GITHUB_WORKSPACE/dist/$CLANG_VERSION"
          TAG="$CLANG_VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT_DIR"/* --clobber
          else
            gh release create "$TAG" \
              "$OUT_DIR"/* \
              --title "$CLANG_VERSION" \
              --notes-file "$OUT_DIR/build-info.txt"
          fi
