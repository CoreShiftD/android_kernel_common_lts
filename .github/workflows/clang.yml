name: Fetch and release AOSP Clang

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-aosp-clang
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve configured Clang versions
    runs-on: ubuntu-24.04

    outputs:
      clang_versions: ${{ steps.resolve.outputs.clang_versions }}
      aosp_ref: ${{ steps.resolve.outputs.aosp_ref }}

    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3

      - name: Resolve configured + latest AOSP Clang
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          AOSP_REF="mirror-goog-main-llvm-toolchain-source"
          REPO_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          TOOLCHAINS_JSON="$GITHUB_WORKSPACE/configs/toolchains.json"

          test -f "$TOOLCHAINS_JSON" || {
            echo "Missing $TOOLCHAINS_JSON" >&2
            exit 1
          }

          rm -rf /tmp/aosp-clang
          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-checkout \
            --branch "$AOSP_REF" \
            "$REPO_URL" \
            /tmp/aosp-clang

          cd /tmp/aosp-clang

          git sparse-checkout init --cone
          git sparse-checkout set README.md
          git checkout

          LATEST_CLANG="$(
            awk '
              /Android Platform/ { in_platform=1; next }
              in_platform && /Currently clang-r/ {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^clang-r[0-9A-Za-z._-]+$/) {
                    print $i
                    exit
                  }
                }
              }
            ' README.md
          )"

          if [ -z "$LATEST_CLANG" ]; then
            echo "Could not resolve Android Platform clang from README.md on $AOSP_REF" >&2
            exit 1
          fi

          echo "Resolved latest Android Platform Clang: $LATEST_CLANG"

          python3 - "$TOOLCHAINS_JSON" "$LATEST_CLANG" <<'PY' > /tmp/clang-versions.json
          import json
          import sys

          path = sys.argv[1]
          latest = sys.argv[2]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          versions = set()

          for key in ("default", "fallback"):
              value = data.get(key)
              if isinstance(value, str) and value.startswith("clang-r"):
                  versions.add(value)

          by_branch = data.get("by_branch", {})
          if isinstance(by_branch, dict):
              for value in by_branch.values():
                  if isinstance(value, str) and value.startswith("clang-r"):
                      versions.add(value)

          extra = data.get("versions", [])
          if isinstance(extra, list):
              for value in extra:
                  if isinstance(value, str) and value.startswith("clang-r"):
                      versions.add(value)

          versions.add(latest)

          print(json.dumps(sorted(versions)))
          PY

          python3 - <<'PY' /tmp/clang-versions.json > /tmp/clang-versions.txt
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              for item in json.load(f):
                  print(item)
          PY

          echo "Will fetch/release:"
          cat /tmp/clang-versions.txt

          while IFS= read -r clang; do
            case "$clang" in
              clang-r*) ;;
              *)
                echo "Invalid clang version: $clang" >&2
                exit 1
                ;;
            esac

            if ! git ls-tree -d --name-only HEAD "$clang" | grep -qx "$clang"; then
              echo "Clang directory does not exist on $AOSP_REF: $clang" >&2
              exit 1
            fi
          done < /tmp/clang-versions.txt

          {
            echo "clang_versions=$(cat /tmp/clang-versions.json)"
            echo "aosp_ref=$AOSP_REF"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.clang }}
    runs-on: ubuntu-24.04
    needs: resolve

    strategy:
      fail-fast: false
      matrix:
        clang: ${{ fromJSON(needs.resolve.outputs.clang_versions) }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git tar zstd

      - name: Sparse-fetch ${{ matrix.clang }}
        shell: bash
        run: |
          set -euo pipefail

          AOSP_REF="${{ needs.resolve.outputs.aosp_ref }}"
          CLANG_VERSION="${{ matrix.clang }}"
          REPO_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"

          rm -rf /tmp/aosp-clang
          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-checkout \
            --branch "$AOSP_REF" \
            "$REPO_URL" \
            /tmp/aosp-clang

          cd /tmp/aosp-clang

          git sparse-checkout init --cone
          git sparse-checkout set "$CLANG_VERSION"
          git checkout

          test -x "$CLANG_VERSION/bin/clang" || {
            echo "Missing $CLANG_VERSION/bin/clang" >&2
            exit 1
          }

          COMMIT="$(git rev-parse HEAD)"
          SHORT_COMMIT="$(git rev-parse --short HEAD)"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          "$CLANG_VERSION/bin/clang" --version | tee "$GITHUB_WORKSPACE/dist/clang-version.txt"

          cat > "$GITHUB_WORKSPACE/dist/build-info.txt" <<EOF
          clang_version=${CLANG_VERSION}
          aosp_ref=${AOSP_REF}
          aosp_project=platform/prebuilts/clang/host/linux-x86
          aosp_commit=${COMMIT}
          source=configs/toolchains.json + latest Android Platform Clang
          EOF

          tar --zstd -cf "$GITHUB_WORKSPACE/dist/${CLANG_VERSION}-linux-x86-${SHORT_COMMIT}.tar.zst" \
            "$CLANG_VERSION"

          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./* > SHA256SUMS

      - name: Upload packaged Clang
        uses: actions/upload-artifact@v4
        with:
          name: clang-${{ matrix.clang }}
          path: dist/*
          retention-days: 1

  release:
    name: Release ${{ matrix.clang }}
    runs-on: ubuntu-24.04
    needs:
      - resolve
      - package

    strategy:
      fail-fast: false
      matrix:
        clang: ${{ fromJSON(needs.resolve.outputs.clang_versions) }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download packaged Clang
        uses: actions/download-artifact@v4
        with:
          name: clang-${{ matrix.clang }}
          path: dist/${{ matrix.clang }}

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          CLANG_VERSION="${{ matrix.clang }}"
          OUT_DIR="$GITHUB_WORKSPACE/dist/$CLANG_VERSION"
          TAG="$CLANG_VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT_DIR"/* --clobber
          else
            gh release create "$TAG" \
              "$OUT_DIR"/* \
              --title "$CLANG_VERSION" \
              --notes-file "$OUT_DIR/build-info.txt"
          fi
